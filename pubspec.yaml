name: free_base
description: "The Free Base companion app for planning, training, and tracking reflex integration."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^4.0.1
  table_calendar: ^3.0.10

  # Firebase & Netzwerk
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_dynamic_links: ^6.0.8
  http: ^1.4.0

  # State-Management, Localization & UI
  provider: ^6.1.5
  intl: 0.20.2
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  google_fonts: ^6.2.1
  go_router: ^13.2.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.1.0
  audioplayers: ^6.0.0
  video_player: ^2.7.0

  # Offline-Persistence mit Hive (inkl. Verschlüsselung)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  # Mocks & Code-Generierung
  mockito: ^5.4.2
  firebase_auth_mocks: ^0.14.1
  build_runner: ^2.4.6
  freezed: ^2.3.2
  json_serializable: ^6.6.0
  intl_utils: ^2.8.9

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/placeholder.png
    - assets/images/paw.png
    - assets/images/tick.png
    - assets/sounds/
    - assets/moro/moro_exercises.json
    - assets/quiz_questions_de.json
    - assets/quiz_questions_en.json
    - assets/videos/test_video.mp4

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated
